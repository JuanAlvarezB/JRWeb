# Actualizaciones automáticas de dependencias. Los PR van hacia qa y pasan por el
# mismo pipeline que cualquier cambio (docs/configuracion-github.md, paso 6).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: qa
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Agrupa los parches y menores de desarrollo en un solo PR para no saturar.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: qa
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    commit-message:
      prefix: 'chore(ci)'
